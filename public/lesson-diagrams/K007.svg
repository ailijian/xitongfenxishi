<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title"><title id="title">时序示意：预约成功或号源不足</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#196455"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#196455"/></marker></defs><style>svg{background:#f5f9f6}text{font:17px system-ui,'PingFang SC',sans-serif;fill:#203c37}.node rect,.node path{fill:#fff;stroke:#71978a;stroke-width:2}.edge{fill:none;stroke:#196455;stroke-width:2}.edge-label{font-size:15px;paint-order:stroke;stroke:#f5f9f6;stroke-width:6px;stroke-linejoin:round}.frame{fill:none;stroke:#71978a;stroke-width:2;stroke-dasharray:7 4}.lifeline{stroke:#a4baae;stroke-dasharray:5 4}.small{font-size:15px}</style><g class="node"><rect x="15" y="20" width="150" height="48" rx="10"/><text x="90" y="50" text-anchor="middle" class=""><tspan x="90" dy="0">患者</tspan></text></g><line class="lifeline" x1="90" y1="68" x2="90" y2="620"/><g class="node"><rect x="210" y="20" width="150" height="48" rx="10"/><text x="285" y="50" text-anchor="middle" class=""><tspan x="285" dy="0">手机App</tspan></text></g><line class="lifeline" x1="285" y1="68" x2="285" y2="620"/><g class="node"><rect x="405" y="20" width="150" height="48" rx="10"/><text x="480" y="50" text-anchor="middle" class=""><tspan x="480" dy="0">预约服务</tspan></text></g><line class="lifeline" x1="480" y1="68" x2="480" y2="620"/><g class="node"><rect x="600" y="20" width="150" height="48" rx="10"/><text x="675" y="50" text-anchor="middle" class=""><tspan x="675" dy="0">号源库</tspan></text></g><line class="lifeline" x1="675" y1="68" x2="675" y2="620"/><path class="edge" d="M90 120 H285" marker-end="url(#arrow)"/><text x="187.5" y="108" text-anchor="middle" class="edge-label"><tspan x="187.5" dy="0">提交预约</tspan></text><path class="edge" d="M285 175 H480" marker-end="url(#arrow)"/><text x="382.5" y="163" text-anchor="middle" class="edge-label"><tspan x="382.5" dy="0">请求预约</tspan></text><path class="edge" d="M480 230 H675" marker-end="url(#arrow)"/><text x="577.5" y="218" text-anchor="middle" class="edge-label"><tspan x="577.5" dy="0">检查并占用号源</tspan></text><rect class="frame" x="10" y="260" width="735" height="365"/><text x="135" y="286" text-anchor="middle" class="small"><tspan x="135" dy="0">alt · 有可用号源</tspan></text><path class="edge" d="M675 325 H480" marker-end="url(#arrow)" stroke-dasharray="8 5"/><text x="577.5" y="313" text-anchor="middle" class="edge-label"><tspan x="577.5" dy="0">占用成功</tspan></text><path class="edge" d="M480 375 H285" marker-end="url(#arrow)" stroke-dasharray="8 5"/><text x="382.5" y="363" text-anchor="middle" class="edge-label"><tspan x="382.5" dy="0">返回预约编号</tspan></text><path class="edge" d="M285 425 H90" marker-end="url(#arrow)" stroke-dasharray="8 5"/><text x="187.5" y="413" text-anchor="middle" class="edge-label"><tspan x="187.5" dy="0">预约成功</tspan></text><line class="frame" x1="10" y1="450" x2="745" y2="450"/><text x="135" y="475" text-anchor="middle" class="small"><tspan x="135" dy="0">else · 无可用号源</tspan></text><path class="edge" d="M675 515 H480" marker-end="url(#arrow)" stroke-dasharray="8 5"/><text x="577.5" y="503" text-anchor="middle" class="edge-label"><tspan x="577.5" dy="0">占用失败</tspan></text><path class="edge" d="M480 565 H285" marker-end="url(#arrow)" stroke-dasharray="8 5"/><text x="382.5" y="553" text-anchor="middle" class="edge-label"><tspan x="382.5" dy="0">返回号源不足</tspan></text><path class="edge" d="M285 615 H90" marker-end="url(#arrow)" stroke-dasharray="8 5"/><text x="187.5" y="603" text-anchor="middle" class="edge-label"><tspan x="187.5" dy="0">提示选择其他时段</tspan></text></svg>
