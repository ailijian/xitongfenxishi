<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" role="img" aria-labelledby="title"><title id="title">简化图：参与者、系统边界与预约用例</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#196455"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#196455"/></marker></defs><style>svg{background:#f5f9f6}text{font:17px system-ui,'PingFang SC',sans-serif;fill:#203c37}.node rect,.node path{fill:#fff;stroke:#71978a;stroke-width:2}.edge{fill:none;stroke:#196455;stroke-width:2}.edge-label{font-size:15px;paint-order:stroke;stroke:#f5f9f6;stroke-width:6px;stroke-linejoin:round}.frame{fill:none;stroke:#71978a;stroke-width:2;stroke-dasharray:7 4}.lifeline{stroke:#a4baae;stroke-dasharray:5 4}.small{font-size:15px}</style><rect class="frame" x="245" y="20" width="430" height="445" rx="16"/><text x="460" y="55" text-anchor="middle" class=""><tspan x="460" dy="0">预约系统 · 系统边界</tspan></text><g class="node"><rect x="20" y="100" width="170" height="72" rx="10"/><text x="105" y="130" text-anchor="middle" class=""><tspan x="105" dy="0">患者</tspan><tspan x="105" dy="24">外部角色</tspan></text></g><g class="node"><rect x="20" y="330" width="170" height="72" rx="10"/><text x="105" y="360" text-anchor="middle" class=""><tspan x="105" dy="0">短信平台</tspan><tspan x="105" dy="24">外部系统</tspan></text></g><g class="node"><rect x="325" y="110" width="255" height="48" rx="24"/><text x="452.5" y="140" text-anchor="middle" class=""><tspan x="452.5" dy="0">预约门诊</tspan></text></g><g class="node"><rect x="325" y="250" width="255" height="48" rx="24"/><text x="452.5" y="280" text-anchor="middle" class=""><tspan x="452.5" dy="0">校验号源</tspan></text></g><g class="node"><rect x="325" y="375" width="255" height="48" rx="24"/><text x="452.5" y="405" text-anchor="middle" clas